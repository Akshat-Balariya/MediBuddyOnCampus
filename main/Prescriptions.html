<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Records | VITB Medical Portal</title>
    <link rel="stylesheet" href="/assets/styles/layout.css">
    <link rel="stylesheet" href="/assets/styles/Prescriptions.css">
</head>
<body data-role="doctor">
    <header data-layout></header>
    <script src="/assets/js/layout.js"></script>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for medicines..." onkeyup="searchTable()">
        </div>
        
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th data-colname="name">Name ↓</th>
                        <th data-colname="count">Count ↓</th>
                        <th data-colname="expire">Expire ↓</th>
                        <th></th>
                    </tr>
                </thead>
                
                <tbody id="myTable"></tbody>
            </table>
        </div>
    </main>
     
    <footer data-layout></footer>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/Prescription.js">
       
    </script>
</body>
</html>

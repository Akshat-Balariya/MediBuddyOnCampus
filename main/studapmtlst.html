<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical History | VITB Medical Portal</title>
    <link rel="stylesheet" href="/assets/styles/layout.css">
    <link rel="stylesheet" href="/assets/styles/studapmtlst.css">
</head>
<body data-role="student">
    <header data-layout></header>
    <script src="/assets/js/layout.js"></script>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchTable()">
        </div>
        
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th data-colname="name">Name ↓</th>
                        <th data-colname="age">Age ↓</th>
                        <th data-colname="appointment_date">Appointment date ↓</th>
                        <th data-colname="status">status ↓</th>
                    </tr>
                </thead>
                
                <tbody id="myTable"></tbody>
            </table>
        </div>
    </main>
     
    <footer data-layout></footer>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/studapmtlst.js">
       
    </script>
</body>
</html>

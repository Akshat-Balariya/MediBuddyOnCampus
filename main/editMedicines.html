<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medicines | VITB Medical Portal</title>
    <link rel="stylesheet" href="/assets/styles/layout.css">
    <link rel="stylesheet" href="/assets/styles/Prescriptions.css">
</head>
<body data-role="doctor">
    <header data-layout></header>
    <script src="/assets/js/layout.js"></script>

    <main>
        <h1>Edit Medicines</h1>
        <div class="form-container">
            <form id="medicineForm">
                <input type="text" id="medicineName" placeholder="Medicine Name" required>
                <input type="number" id="medicineCount" placeholder="Count" required>
                <input type="date" id="medicineExpire" placeholder="Expiration Date" required>
                <button type="submit">Add/Update Medicine</button>
            </form>
        </div>
        <div class="table-container">
            <h2>Existing Medicines</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Count</th>
                        <th>Expire</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="medicineTable"></tbody>
            </table>
        </div>
    </main>

    <footer data-layout></footer>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/editMedicines.js"></script>
</body>
</html>

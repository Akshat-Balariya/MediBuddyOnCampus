<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Ambulance | VITB Medical Portal</title>
    <link rel="stylesheet" href="/assets/styles/layout.css">
    <link rel="stylesheet" href="/assets/styles/Ambulance.css">
</head>
<body data-role="student">
    <header data-layout></header>
    <script src="/assets/js/layout.js"></script>

    <main>
        <div id="ambulance-card">
            <h1>Ambulance Request Form</h1>
            <form id="ambulanceForm">
                <div class="form-field">
                    <label for="appointment-date">Select Date:</label>
                    <input type="date" id="appointment-date" name="date" required>
                </div>
                <div class="form-field">
                    <label for="Location">Location:</label>
                    <select name="Place" id="Place" required>
                        <option value="" disabled selected>Place</option>
                        <option value="Ashta">Ashta</option>
                        <option value="Sehore">Sehore</option>
                        <option value="Bhopal">Bhopal</option>
                        <option value="other">Other</option>
                    </select>
                    <textarea name="location" id="locationField" rows="3" maxlength="255" placeholder="Enter detailed location" required></textarea>
                    <p id="charCount">50 characters left</p>
                </div>
                <div id="submit-button">
                    <button id="request-ambulance" type="submit">Request Ambulance</button>
                </div>
            </form>
        </div>
    </main>

    <footer data-layout></footer>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/Ambulance.js"></script>
</body>
</html>

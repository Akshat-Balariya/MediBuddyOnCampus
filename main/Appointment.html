<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | VITB Medical Portal</title>
    <link rel="stylesheet" href="/assets/styles/layout.css">
    <link rel="stylesheet" href="/assets/styles/Appointment.css">
</head>
<body data-role="student">
    <header data-layout></header>
    <script src="/assets/js/layout.js"></script>

    <main>
        <div class="slider_area">
            <div class="popup_inner">
                <h3>Book an <span>Appointment</span></h3>
                <form id="appointmentForm">
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                    <input type="number" id="age" name="age" placeholder="Your Age" min="1" max="120" required>
                    <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
                    <input type="email" id="email" name="email" placeholder="Email Address" required>
                    <input name="appointment_date" id="appointment_date" placeholder="Appointment Date" class="textbox-n" type="datetime-local" required>
                    <input name="symptoms" id="symptoms" placeholder="Symptoms" type="text" required>
                    <button type="submit" id="subBtn" class="boxed-btn3">Make an Appointment!</button>
                </form>

            </div>
        </div>
    </main>

    <footer data-layout></footer>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/Appointment.js"></script>
</body>
</html>
